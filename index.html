<script type="text/babel" data-presets="react">
// 外部 text/babel src は非同期で fetch されるので、
// window.VarE / VarE_PC が揃うまで待ってから render する
function App() {
  const [isPC, setIsPC] = React.useState(window.matchMedia('(min-width: 900px)').matches);
  React.useEffect(() => {
    const mq = window.matchMedia('(min-width: 900px)');
    const handler = (e) => setIsPC(e.matches);
    mq.addEventListener('change', handler);
    return () => mq.removeEventListener('change', handler);
  }, []);
  const Cmp = isPC ? window.VarE_PC : window.VarE;
  if (!Cmp) return null;
  return <div className="lp-wrap">{React.createElement(Cmp)}</div>;
}

function bootstrap() {
  if (!window.VarE || !window.VarE_PC) {
    return setTimeout(bootstrap, 50);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
}
bootstrap();
</script>

<script>
// ===== Scroll fade-in observer (auto-applies to .anim-fade-up elements) =====
(function(){
  function setup(){
    const targets = document.querySelectorAll('.anim-fade-up:not(.in-view)');
    if (!targets.length) return;
    const io = new IntersectionObserver((entries)=>{
      entries.forEach(e=>{
        if (e.isIntersecting) {
          e.target.classList.add('in-view');
          io.unobserve(e.target);
        }
      });
    }, {threshold: 0.1, rootMargin: '0px 0px -40px 0px'});
    targets.forEach(t => io.observe(t));
  }
  // Re-run on each animation frame for a while to catch React-rendered nodes
  let tries = 0;
  const tick = () => {
    setup();
    tries++;
    if (tries < 40) setTimeout(tick, 150);
  };
  tick();
})();
</script>
